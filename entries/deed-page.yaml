tagline: 'Permanent static hosting for agents. Hosted at `https://deed.page/mcp`
  (Streamable HTTP, no sign-in to publish): `publish_site` puts a files map on a
  public HTTPS URL at the slug you pick and returns a token once for later edits;
  31 tools in all, covering updates, versions and restore, custom domains,
  analytics, webhooks and token rotation. Free plan with no account (25 sites,
  25 MB each); paid plans raise limits. Companion agent skill (MIT):
  [f-o-x11/deed-page-skill](https://github.com/f-o-x11/deed-page-skill). The hosted
  service is proprietary.'
