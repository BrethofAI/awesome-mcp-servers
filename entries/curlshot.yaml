tagline: 'CurlShot screenshots of public web pages, two tools: `take_screenshot` renders
  a page in a real browser and returns PNG, JPEG, WebP, PDF or a scrolling video, with
  ads and cookie banners hidden by default; `list_devices` lists phone, tablet and desktop
  presets. Hosted at `https://curlshot.com/api/mcp` (API key as a Bearer token; `list_devices`
  works without one). Each successful render uses one screenshot of the monthly quota:
  free plan 100 a month with no card, paid plans from $19 a month. No public server source;
  the MIT repo holds docs and client configs.'
