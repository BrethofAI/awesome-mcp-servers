tagline: 'Pinecone''s Developer MCP: search Pinecone docs, list, describe and create
  indexes, upsert and search records or documents, and rerank. Runs with `npx @pinecone-database/mcp`
  and an API key (docs search works without one). Works with document indexes (full-text
  search and/or integrated embedding) and integrated-inference indexes; search with your
  own vectors is not supported. Separately, each Pinecone Assistant is a hosted MCP endpoint
  for retrieving context.'
