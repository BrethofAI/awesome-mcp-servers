tagline: 'CloudGPU''s stdio server (`npx -y cloudgpu-mcp`) for renting GPUs by the minute from
  an MCP client: it quotes a GPU, rents it only after you confirm, uploads your code and data,
  runs the job, watches the logs, downloads the results and destroys the instance. It also
  calls CloudGPU''s OpenAI-compatible model API. Machines come from CloudGPU''s partner suppliers
  and independent hosts. Signs in with a CloudGPU API key, or through a connect link you approve
  in the browser with a spending limit. Job files and prompts go to CloudGPU. Everything is paid
  from a prepaid balance topped up by card or USDT (TRC-20) (see the
  [pricing](https://cloudgpu.app/pricing)). MIT.'
