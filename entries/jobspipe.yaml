  layoffs, plus docs and pricing tools. Authenticated endpoint at `https://mcp.jobspipe.dev/mcp`
  (OAuth or API key; free tier with credits at jobspipe.dev/signup); a no-key demo
  at `https://jobspipe.dev/mcp` exposes catalog tools and capped sandbox search. Docs:
  https://docs.jobspipe.dev/ai-agents/mcp. MIT repo with server card and client configs;
  the hosted backend is not public.'
