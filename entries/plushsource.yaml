tagline: 'PlushSource''s stdio server (`npx -y plushsource-mcp`, no key) for its facts-only
  directory of 55 custom plush manufacturers: filter by country, category, MOQ, certifications,
  accepted design inputs, products and OEM/ODM, compare two to five makers side by side, and
  draft an RFQ email from a project brief. The dataset ships inside the package and the server
  makes no network calls. Each fact comes from the manufacturer''s own public pages; corrections
  go to the repo. Official registry `io.github.quickman924/plushsource-mcp`. MIT.'
