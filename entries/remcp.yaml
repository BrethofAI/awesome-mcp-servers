tagline: >-
  ReMCP remotely controls only computers explicitly paired to the user's
  account. It offers file management, terminal execution, browser and native
  desktop automation, screenshots and diagnostics, with state-changing tools.
  Hosted MCP at https://remcp.site/mcp requires ReMCP OAuth; the paired device
  agent connects outbound. MIT client/runtime source.
