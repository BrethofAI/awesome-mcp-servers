tagline: 'SFXMint''s server (4 tools): finds sound effects for apps and games by interface
  event, by one of 18 sets or by description, and returns permanent download URLs. Hosted
  at `https://sfxmint.com/mcp`; no account or key needed. Free use is MP3 with limits
  (20 lookups and 5 downloads a day per network; a free account''s API key gives 100 lookups
  and 20 downloads a month); a one-time download pack ($9.90 for 30 days, $69 for a year)
  lifts the limits and adds WAV. Sounds are AI-generated or procedurally synthesized and
  dedicated to the public domain under CC0 1.0; SFXMint no longer makes new sounds. No
  public server source; the repo (connection docs and an Agent Skill) is CC0.'
