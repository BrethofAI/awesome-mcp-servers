tagline: 'NeverApply''s hosted MCP for job search: search and read jobs without signing in;
  signed in (OAuth 2.1 with PKCE, no API key), match roles to your profile, tailor resumes,
  save screening answers, prepare for interviews, and submit applications to jobs you approve
  (15 tools). Endpoint `https://neverapply.co/mcp` (Streamable HTTP). Free to start, with
  paid tiers for higher volume. Docs: https://neverapply.co/features/mcp. Official registry
  `co.neverapply/neverapply`. The MIT repo holds only plugin manifests and skills; the server
  source is not public.'
