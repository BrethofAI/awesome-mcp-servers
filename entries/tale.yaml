tagline: 'Tale''s own MCP endpoint on a Tale team workspace you deploy yourself: `get_knowledge`
  retrieves your organisation''s knowledge passages, and agents can author, validate, save
  and run the workspace''s automations (`run_automation` tests against mocks; `run_deployed`
  runs them live). HTTPS JSON-RPC with a Bearer API key plus an `X-Organization-Slug` header,
  so the client must support custom headers; no public hosted endpoint. MIT, free to self-host.'
