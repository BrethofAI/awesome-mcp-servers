  + OAuth 2.1 PKCE with dynamic client registration). Works with Claude, Cursor,
  Cline and other MCP clients. Free to start; Pro/Max paid tiers for higher volume.
  Docs: https://neverapply.co/features/mcp. Official registry `co.neverapply/neverapply`.
  MIT public repo; the hosted backend is not fully open-sourced.'
