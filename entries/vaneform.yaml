tagline: 'Vaneform''s hosted server (`https://vaneform.com/mcp`, Streamable HTTP) for website
  research (10 tools): estimated monthly visits, trend, rank, top countries, traffic sources
  and registry facts for a domain (`lookup_domain`), side-by-side comparisons (`compare_bulk`,
  `compare_tld`), Google ads and AdSense research by domain or advertiser (`research_site`),
  a Pro-only US keyword brief, and a private research workspace where it saves queries and
  notes and monitors ads daily or weekly. Discovery is open; tool calls need a Vaneform API
  key, and a free account covers domain lookups. Traffic figures are third-party estimates.
  MIT server, CLI and agent skill.'
