tagline: 'Docsy''s version-aware developer documentation index, five tools: `resolve-library-id`,
  `list-library-versions`, `query-docs` (focused excerpts or publisher links for one library
  and version), `search` and `fetch`, each result with a link to the original source. Hosted
  at `https://docsy.remcp.site/mcp/registry` (OAuth 2.1 sign-in) or `https://docsy.remcp.site/mcp/public`
  (no account, rate-limited, public docs only). Free to use under fair-use limits, per Docsy''s
  terms. No public server source; the MIT repo holds plugin manifests and install guides,
  and the TypeScript SDK and CLI are open source (MIT).'
