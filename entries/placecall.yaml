tagline: 'VOYGR''s PlaceCall lets an agent phone US businesses for bookings, inquiries
  and quotes. An AI voice agent places a real outbound call, gets through phone menus
  and hold, passes the business''s questions back to you mid-call, and returns the
  outcome, transcript and recording; it can also suggest businesses to call. Calls are
  for businesses only, and none go to Indiana, Louisiana, Minnesota, Montana or Nebraska.
  The terms make you responsible for consent, call-recording and robocall law. Calls
  placed over MCP open with a recorded-line notice that names PlaceCall but does not say
  the caller is an AI; asked directly, the agent says it is a digital assistant. Hosted
  at `https://api.voygr.tech/mcp` (OAuth sign-in or API key). 250 free calls (up to 25
  a day), then $0.10 per call that gets a result; calls that get nothing are free.
  The calling service is closed source; the plugin and skill repo is MIT.'
