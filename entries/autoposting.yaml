tagline: Draft, schedule, and publish social posts (X, LinkedIn, Instagram, Threads,
  YouTube), carousels, and video clips. Hosted at `https://app.autoposting.ai/mcp`
  (OAuth 2.1, 70 tools); also a local stdio CLI (`ap mcp`) that calls the same API.
  The tools you see depend on the scopes you grant, and some are destructive. Needs
  a paid Autoposting plan. No public server source or licence.
