tagline: 'Moss''s server for its semantic search service (17 tools): semantic, keyword or
  hybrid search over your Moss indexes, run locally once an index has been downloaded into
  memory. It also creates, fills and deletes indexes and documents, builds indexes from local
  PDF or DOCX files (with OCR) and crawls websites into indexes. Runs locally over stdio (`npx
  -y @moss-tools/mcp-server`, currently a beta) and needs a Moss project ID and key; needs
  glibc Linux, macOS or Windows (no Alpine). Free Developer plan (1 project, 3 indexes), paid
  plans from $30 a month. The npm package is MIT and ships readable compiled JavaScript; its
  source repo is not public.'
