tagline: Browser Use's own server. Local stdio (`uvx --from 'browser-use[cli]' browser-use
  --mcp`) gives direct browser tools (navigate, click, type, scroll, tabs, extract,
  screenshot) plus an autonomous agent tool that needs your OpenAI or Anthropic key.
  A hosted Cloud MCP at `https://api.browser-use.com/v3/mcp` (API key, pay-as-you-go
  credits) runs agent sessions in Browser Use's cloud.
