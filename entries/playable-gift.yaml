tagline: 'Playable Gift''s server (8 tools): makes a small browser game about one person
  from habits or inside jokes the sender supplies, returns a play link to share, and
  saves and revises self-written HTML games as private drafts. Hosted at `https://playablegift.com/mcp`
  with no sign-in; once the daily free pool for assistants is used up, it asks for an
  email-code sign-in or hands off to the website. Free within daily limits; optional
  subscription for more games. Its terms let it store and share, license or sell game
  content, including the names in it, after asking for consent. No public source.'
