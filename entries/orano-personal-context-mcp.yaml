tagline: 'ORANO''s hosted server for its library of saved videos, posts and links (43 tools):
  save a link and wait for ORANO''s analysis (transcripts, frame evidence, key points, task
  plans), read and search the library, run research, plan tasks, organize, and ask its assistant
  Ori. Keys carry read and write scopes unless created read-only; write saves, changes, deletes
  and runs AI work. Streamable HTTP on Google Cloud Run with a personal `orano_sk_` key as
  a bearer token (no OAuth). The docs list MCP access at $5 a month. The service is closed source; the repo
  holds examples.'
