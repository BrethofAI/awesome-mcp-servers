tagline: 'ClickHouse''s official server: `run_query`, `list_databases`, `list_tables`
  (plus chDB). Read-only by default; writes need `CLICKHOUSE_ALLOW_WRITE_ACCESS=true`,
  and destructive statements also need `CLICKHOUSE_ALLOW_DROP=true`. ClickHouse Cloud
  users can instead use the hosted remote MCP at `https://mcp.clickhouse.cloud/mcp`
  (OAuth, SELECT-only, enabled per service).'
