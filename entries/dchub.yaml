tagline: 'DC Hub''s server for data-center site selection: facilities and markets, grid
  and interconnection queues, power, gas and energy prices, fiber, permitting and M&A
  deals, with DC Hub''s Data Center Power Index (DCPI), a daily score of where data
  centers can get grid power across 300+ markets (94 tools). Also saves sites and shortlists,
  sets email and webhook alerts, and sends capacity introduction requests to providers.
  Hosted at `https://dchub.cloud/mcp`; previews need no key, a free key adds two full
  answers per tool per day (more with an email), and full results need a paid plan
  or credit pack, or a per-call Stripe payment on some tools. Logs every tool call,
  with its parameters, to DC Hub (kept 90 days). The MCP gateway is MIT; the data backend it calls
  is not public.'
