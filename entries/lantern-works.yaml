tagline: 'Lantern Works'' server for comparing GPU rental prices across the providers it tracks:
  current hourly rates with their source and age, price changes, the cost of one GPU job, and
  the cheapest stack for a described workload. It also searches Lantern''s directory of deals
  on agent services (compute, scraping, search, email, hosting). Most of those deals (166 of 202
  on 2026-11-12) are affiliate links, marked as such in the feed, and redeem links go through
  Lantern''s click-tracking redirect. Run it locally with `uvx lantern-works-deals-mcp` or use the
  hosted endpoint `https://lantern-works-mcp.lantern-works.workers.dev/mcp`; no account or key.
  The hosted server also registers webhooks that alert you when a price moves. MIT.'
