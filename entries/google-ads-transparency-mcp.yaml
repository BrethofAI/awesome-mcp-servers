  that calls a hosted Apify endpoint with your own `APIFY_TOKEN`; hosted Streamable HTTP
  at `https://mcp.apify.com?tools=publicrecords/google-ads-transparency-scraper` with Apify OAuth. Disclosure: I maintain this server.'
