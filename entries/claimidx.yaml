tagline: 'Shared index of known software failures and their fixes, for coding agents:
  ask before retrying, then record the fix. Runs locally (PyPI `claimidx`, Apache-2.0)
  but connects to a public commons at home.claimidx.com by default and syncs with
  it at session start. Since v0.7.14, publishing a claim to the commons asks for confirmation
  (earlier versions shared automatically); `CLAIMIDX_COMMONS=0` turns the commons
  off.'
