tagline: 'Tale''s own MCP endpoint (`/api/v1/mcp`) on a Tale team workspace: `get_knowledge`
  retrieves your organisation''s knowledge passages, and agents can author, validate, save
  and run the workspace''s automations (`run_automation` tests against mocks; `run_deployed`
  runs them live). Coding agents sign in through the browser (OAuth, on by default since
  v0.5.89), or a client sends a Bearer API key plus an `X-Organization-Slug` header; no
  public shared endpoint. MIT, free to self-host; managed Cloud instances come with the
  paid Enterprise plan.'
